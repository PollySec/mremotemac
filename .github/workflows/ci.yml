name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and package (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # MinVer needs the tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache native dependencies (OpenSSL, FreeRDP)
        id: deps
        uses: actions/cache@v4
        with:
          path: ../mRemoteMac-deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/build-deps.sh') }}

      - name: Build native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./native/build-deps.sh

      - name: Build native shim
        run: ./native/build.sh

      - name: Restore
        run: dotnet restore mRemoteMac.slnx

      - name: Build (warnings are errors)
        run: dotnet build mRemoteMac.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/MRemoteMac.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Package app, zip and dmg
        run: ./packaging/make-app.sh Release

      - uses: actions/upload-artifact@v4
        with:
          name: mRemoteMac-macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
          generate_release_notes: false

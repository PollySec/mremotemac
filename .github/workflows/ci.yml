name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and package (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # MinVer needs the tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache native dependencies (OpenSSL, FreeRDP)
        id: deps
        uses: actions/cache@v4
        with:
          path: ../mRemoteMac-deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/build-deps.sh') }}

      - name: Build native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./native/build-deps.sh

      - name: Build native shim
        run: ./native/build.sh

      - name: Restore
        run: dotnet restore mRemoteMac.slnx -p:Configuration=Release

      - name: Build (warnings are errors)
        run: dotnet build mRemoteMac.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/MRemoteMac.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Package app, zip and dmg
        run: ./packaging/make-app.sh Release

      - uses: actions/upload-artifact@v4
        with:
          name: mRemoteMac-macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
          generate_release_notes: false

  # Builds and tests Windows on every push, but never uploads to a release: the MSIs in a release are signed
  # (packaging/windows/sign.ps1) and a job here would replace them.
  windows:
    name: Build, test and package (Windows ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-2025 }
          - { arch: arm64, os: windows-11-arm }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # MinVer needs the tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache native dependencies (OpenSSL, FreeRDP)
        id: deps
        uses: actions/cache@v4
        with:
          path: ../mRemoteMac-deps-win
          key: deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('native/build-deps-win.ps1', 'native/freerdp-windows.patch') }}

      - name: Build native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./native/build-deps-win.ps1 -Arch ${{ matrix.arch }}

      - name: Build native shim
        run: ./native/build-win.ps1 -Arch ${{ matrix.arch }}

      - name: Build (warnings are errors)
        run: dotnet build src/MRemoteMac -c Release -r win-${{ matrix.arch }} -warnaserror

      - name: Test
        run: dotnet test tests/MRemoteMac.Tests -c Release -r win-${{ matrix.arch }}

      - name: Package app and unsigned MSI
        run: |
          ./packaging/windows/make-msi.ps1 -Arch ${{ matrix.arch }} -Step Publish
          ./packaging/windows/make-msi.ps1 -Arch ${{ matrix.arch }} -Step Package

      - uses: actions/upload-artifact@v4
        with:
          name: mRemoteMac-windows-${{ matrix.arch }}-unsigned
          path: dist/*.msi
